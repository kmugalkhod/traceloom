# Lite mode: the web server alone, with SQLite and a local blob folder.
#   docker compose -f docker-compose.lite.yml up --build
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      TRACELOOM_MODE: lite
      TRACELOOM_ENV: ${TRACELOOM_ENV:-dev}
      TRACELOOM_SERVER_SECRET: ${TRACELOOM_SERVER_SECRET:-}
      DATABASE_URL: sqlite:////data/traceloom.db
      TRACELOOM_BLOB_DIR: /data/blobs
    volumes:
      - traceloom-data:/data
    mem_limit: 768m
    restart: unless-stopped

volumes:
  traceloom-data:
