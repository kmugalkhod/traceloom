[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceloom-sdk"
version = "0.1.0"
description = "Python SDK for Traceloom."
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
langchain = ["langchain-core>=0.2"]

[tool.setuptools.packages.find]
include = ["traceloom_sdk*"]

[tool.ruff]
line-length = 100
target-version = "py39"  # the SDK supports Python 3.9+

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixture payloads
