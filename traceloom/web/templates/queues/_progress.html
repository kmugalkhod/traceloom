{# A progress bar: expects `stats` and `bar` in scope; `label` names it for assistive tech. #}
<div class="prog{{ ' thin' if thin }}" role="progressbar" aria-valuenow="{{ stats.percent }}" aria-valuemin="0" aria-valuemax="100" aria-label="{{ label }}"><i class="d w{{ bar.d | round | int }}"></i><i class="s w{{ bar.s | round | int }}"></i></div>
