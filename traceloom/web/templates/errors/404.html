{% extends layout %}
{% import "_macros.html" as m %}
{% block title %}Not found{% endblock %}
{% block content %}
<div class="empty">
  <span class="err-code">404</span>
  <h1>Page not found</h1>

  </div>
</div>
{% endblock %}
