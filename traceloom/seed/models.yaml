# Built-in model definitions (FR-C1), loaded at startup as global definitions.
#
# Prices are USD per token for each usage key (input, output, cache_read, cache_write),
# approximated from public list prices and meant as a starting point: override any of them
# per project on the Models settings page. A `tiers` entry replaces the listed prices when the
# input tokens of a generation exceed its threshold. `match` is a case-insensitive regex
# searched in the model name; `tokenizer` is `tiktoken:<encoding>` and is only used to count
# tokens when a generation reports no usage.
version: 1
models:
  - model_name: claude-opus-4-5
    match: '(?i)^(?:[\w.:-]+[/.])?claude-opus-4-5(?:-\d{8})?(?:-latest|-v\d+:\d+)?$'
    tokenizer: null
    valid_from: 2024-01-01
    prices: {input: 5.000e-6, output: 2.500e-5, cache_read: 5.000e-7, cache_write: 6.250e-6}
  - model_name: claude-opus-4-1
    match: '(?i)^(?:[\w.:-]+[/.])?claude-opus-4-1(?:-\d{8})?(?:-latest|-v\d+:\d+)?$'
